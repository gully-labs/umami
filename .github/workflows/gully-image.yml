# Gully Analytics: build the image on GitHub's runners (the build needs more memory than our
# servers can spare) and publish it to ghcr.io/gully-labs/gully-analytics.
name: Gully Analytics image

on:
  push:
    branches: [gully/analytics]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gully-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gully-labs/gully-analytics:${{ github.sha }}
            ghcr.io/gully-labs/gully-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
